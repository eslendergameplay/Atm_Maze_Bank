name: atm_app
description: "Aplicacion basada en el Atm De Maze Bank De Gta V"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  animate_do: ^5.1.0
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^3.5.0
  formz: ^0.8.1
  gen_art_bg: ^0.5.1
  go_router: ^18.1.4
  icons_launcher: ^3.1.0
  material_ui: ^1.11.0
  popover: ^0.5.1
  riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  shared_preferences: ^2.5.6
  bcrypt: ^1.1.3
  encrypt: ^5.0.1

dev_dependencies:
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.10

flutter:
  uses-material-design: true
  assets:
    - assets/

icons_launcher:
  image_path: "assets/logoBank.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true
    web:
      enable: true
